repos:
- repo: local
  hooks:
    - id: style-check
      exclude: ^(\.claude/|\.codex/|\.github/fork-only-files\.txt$|\.github/workflows/(capabilities-drift|editorconfig|melee-agent|style-check|taxonomy-pages)\.yml$|\.vscode/|AGENTS\.md$|CLAUDE\.md$|decomp\.yaml$|docs/|permuter_settings\.toml$|tools/)
      name: style-check
      entry: python tools/check/main.py
      args: [--fix,--quiet]
      language: system
      types_or: [c]
      pass_filenames: true
      require_serial: true
- repo: https://github.com/cpp-linter/cpp-linter-hooks
  rev: v1.6.0
  hooks:
    - id: clang-tidy
      files: ^src/
      args:
      - --version=22.1.8
      - -p=.
      - --experimental-custom-checks
      - --fix
      - --fix-errors
      require_serial: true
    - id: clang-format
      exclude: ^(\.claude/|\.codex/|\.github/fork-only-files\.txt$|\.github/workflows/(capabilities-drift|editorconfig|melee-agent|style-check|taxonomy-pages)\.yml$|\.vscode/|AGENTS\.md$|CLAUDE\.md$|decomp\.yaml$|docs/|permuter_settings\.toml$|tools/)
      args: [--version=22.1.8]
      types_or: [file]
      files: \.(c|h|dox)$
      require_serial: true
- repo: https://github.com/editorconfig-checker/editorconfig-checker.python
  rev: 3.11.1
  hooks:
    - id: editorconfig-checker
      exclude: ^(\.claude/|\.codex/|\.github/fork-only-files\.txt$|\.github/workflows/(capabilities-drift|editorconfig|melee-agent|style-check|taxonomy-pages)\.yml$|\.vscode/|AGENTS\.md$|CLAUDE\.md$|decomp\.yaml$|docs/|permuter_settings\.toml$|tools/)

- repo: local
  hooks:
  - id: melee-style-check
    name: Melee style check
    entry: python tools/check-style.py
    language: python
    types: [c]
    pass_filenames: true
    description: >
      Checks C/H files for style violations derived from doldecomp/melee
      maintainer feedback. See docs/STYLE_GUIDE.md for details.

  - id: check-fork-files
    name: Check for fork-only files
    entry: python tools/check-fork-files.py
    language: python
    pass_filenames: false
    always_run: true
    stages: [pre-push]
    description: Blocks pushing fork-specific files to doldecomp/melee upstream

  - id: capabilities-drift
    name: capabilities index up to date
    entry: bash -c 'melee-agent capabilities generate && git diff --exit-code -- .claude/capabilities-brief.md docs/CAPABILITIES.md'
    language: system
    pass_filenames: false
    files: '^(tools/melee-agent/src/cli/|\.claude/skills/|\.claude/hooks/|\.claude/settings\.json|CLAUDE\.md|docs/agent-tool-manifest\.md)'
